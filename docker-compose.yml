# Ephemeral API: data is baked into the image, the filesystem is read-only, nothing is persisted.
# Run:  docker compose run --rm --service-ports api
services:
  api:
    build: { context: ., dockerfile: server/Dockerfile }
    image: swaradb-api
    ports: ["3001:3001"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
